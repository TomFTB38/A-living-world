# Fabrique le programme Windows du moteur final et le publie dans la version « moteur-dev ».
name: Moteur Windows
on:
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests du cœur
        run: cargo test --release
        working-directory: engine/core
      - name: Compilation
        run: cargo build --release
        working-directory: engine/game
      - name: Capture réelle sur la carte logicielle Windows
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p capture
          engine/game/target/release/a-living-world.exe --capture capture/spawn.bmp -38.5 53 0.5 -20 52 -30 16.4 6 1280 720 2048 2>&1 | tee capture/journal.txt
          cp engine/game/target/release/alw-erreur.txt capture/ 2>/dev/null || true
          engine/game/target/release/a-living-world.exe --capture capture/eau.bmp -62 47 -55 -54 42 -51 16.4 5 1280 720 2048 2>&1 | tee -a capture/journal.txt
          engine/game/target/release/a-living-world.exe --capture capture/jeu.bmp -38.5 52.5 0.5 -36 50 3 16.4 4 1280 720 2048 jeu 2>&1 | tee -a capture/journal.txt
          engine/game/target/release/a-living-world.exe --capture capture/tiers.bmp -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 tiers 2>&1 | tee -a capture/journal.txt
          engine/game/target/release/a-living-world.exe --capture capture/bras.bmp -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 bras 2>&1 | tee -a capture/journal.txt
          engine/game/target/release/a-living-world.exe --capture capture/inv.bmp -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 inv 2>&1 | tee -a capture/journal.txt
      - name: Dépose la capture sur la branche captures
        shell: bash
        continue-on-error: true
        run: |
          cd capture
          git init -q -b captures
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "Capture ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" captures
      - uses: actions/upload-artifact@v4
        with:
          name: a-living-world-windows
          path: engine/game/target/release/a-living-world.exe
      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete moteur-dev --yes --cleanup-tag || true
          gh release create moteur-dev engine/game/target/release/a-living-world.exe --title "Moteur final, version de développement" --notes "Commit ${GITHUB_SHA::7}. Téléchargez a-living-world.exe et lancez-le." --prerelease
