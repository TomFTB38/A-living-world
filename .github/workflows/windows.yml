# Fabrique le programme Windows du moteur final et le publie dans la version « moteur-dev ».
name: Moteur Windows
on:
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
# Une nouvelle version annule la compilation de la précédente : seule la plus récente est publiée.
concurrency:
  group: moteur-windows
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Cache de compilation : les dépendances (wgpu, winit…) ne sont recompilées que si Cargo.lock change.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/core/target
            engine/game/target
          key: windows-cargo-${{ hashFiles('engine/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-${{ hashFiles('engine/**/Cargo.lock') }}-
            windows-cargo-
      - name: Tests du cœur
        run: cargo test --release
        working-directory: engine/core
      - name: Compilation
        run: cargo build --release
        working-directory: engine/game
      - name: Capture réelle sur la carte logicielle Windows
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p capture
          # Seules les captures listées dans engine/captures.txt sont prises (« toutes » pour la série complète).
          want() { grep -v "^#" engine/captures.txt | grep -qwE "$1|toutes"; }
          shot() { n=$1; shift; want "$n" || return 0; for essai in 1 2 3; do rm -f capture/$n.bmp engine/game/target/release/alw-erreur.txt; timeout 240 engine/game/target/release/a-living-world.exe --capture capture/$n.bmp "$@" 2>&1 | tee -a capture/journal.txt; c=${PIPESTATUS[0]}; echo "== $n : code $c (essai $essai)" | tee -a capture/journal.txt; cat engine/game/target/release/alw-erreur.txt 2>/dev/null | tee -a capture/journal.txt; [ "$c" = 0 ] && break; done; }
          shot spawn -38.5 53 0.5 -20 52 -30 16.4 6 1280 720 2048
          shot eau -62 47 -55 -54 42 -51 16.4 5 1280 720 2048
          shot jeu -38.5 52.5 0.5 -36 50 3 16.4 4 1280 720 2048 jeu
          for sc in tiers bras inv creatif roches menu brume faune; do shot $sc -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 $sc; done
          shot abattage -38.5 53 0.5 -20 52 -30 16.4 5 1280 720 2048 abattage
          shot coule -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 coule
          for sc in visage course accroupi saut roulade; do shot $sc -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 $sc; done
          shot sous_eau -62 47 -55 -54 42 -51 16.4 4 1280 720 2048 sous_eau
          shot horizon -38.5 53 0.5 -20 52 -30 16.4 6 1280 720 2048 horizon
          shot montagne -38.5 53 0.5 -20 52 -30 16.4 6 1280 720 2048 montagne
          shot taiga -38.5 53 0.5 -20 52 -30 14 4 1280 720 2048 taiga
          shot steppe -38.5 53 0.5 -20 52 -30 17.2 4 1280 720 2048 steppe
          shot taiga_matin -38.5 53 0.5 -20 52 -30 7.4 4 1280 720 2048 taiga
          shot taiga_nuit -38.5 53 0.5 -20 52 -30 23.5 4 1280 720 2048 taiga
          shot taiga_faune -38.5 53 0.5 -20 52 -30 13 4 1280 720 2048 taiga_faune
          shot virevoltant -38.5 53 0.5 -20 52 -30 16 4 1280 720 2048 virevoltant
          shot tronc_creux -38.5 53 0.5 -20 52 -30 15 4 1280 720 2048 tronc_creux
          shot materiaux -38.5 53 0.5 -20 52 -30 14 4 1280 720 2048 materiaux
          shot desert -38.5 53 0.5 -20 52 -30 15 4 1280 720 2048 desert
          shot oasis -38.5 53 0.5 -20 52 -30 16.5 4 1280 720 2048 oasis
          shot cactus -38.5 53 0.5 -20 52 -30 16 4 1280 720 2048 cactus
          shot hautes_terres -38.5 53 0.5 -20 52 -30 15 4 1280 720 2048 hautes_terres
          shot foret -38.5 53 0.5 -20 52 -30 11 3 1280 720 1024 foret
          shot foret_nuit -38.5 53 0.5 -20 52 -30 22.5 3 1280 720 1024 foret
          shot f3 -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 f3
          shot prairie -38.5 53 0.5 -20 52 -30 16.4 5 1280 720 2048 prairie
          shot chute -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 chute
          shot grotte -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 grotte
          shot ultra -38.5 53 0.5 -20 52 -30 16.4 8 1280 720 2048 ultra
          shot pluie -62 47 -55 -54 42 -51 16.4 4 1280 720 2048 pluie
          for sc in survie craft mort ramassage fissure construction; do shot $sc -38.5 53 0.5 -20 52 -30 16.4 4 1280 720 2048 $sc; done
          shot campement -38.5 53 0.5 -20 52 -30 20.6 4 1280 720 2048 campement
          shot faune -38.5 53 0.5 -20 52 -30 15 4 1280 720 2048 faune
          for sc in village artisan carte survol; do shot $sc -38.5 53 0.5 -20 52 -30 10.5 4 1280 720 2048 $sc; done
      - name: Dépose la capture sur la branche captures
        shell: bash
        continue-on-error: true
        run: |
          cd capture
          git init -q -b captures
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "Capture ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" captures
      # Garde-fou : si le jeu ne démarre pas (captures de contrôle absentes), rien n'est publié.
      - name: Le jeu démarre
        shell: bash
        run: test -f capture/spawn.bmp && test -f capture/jeu.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: a-living-world-windows
          path: engine/game/target/release/a-living-world.exe
      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete moteur-dev --yes --cleanup-tag || true
          gh release create moteur-dev engine/game/target/release/a-living-world.exe --title "Moteur final, version de développement" --notes "Commit ${GITHUB_SHA::7}. Téléchargez a-living-world.exe et lancez-le." --prerelease
